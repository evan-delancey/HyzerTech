<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050d14"/>
    </radialGradient>

    <!-- Disc gradient - electric blue/cyan -->
    <radialGradient id="discGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4af0ff"/>
      <stop offset="40%" stop-color="#00c8e0"/>
      <stop offset="100%" stop-color="#0077a8"/>
    </radialGradient>

    <!-- Speed line glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for disc -->
    <filter id="discGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for disc shape -->
    <clipPath id="discClip">
      <ellipse cx="200" cy="168" rx="88" ry="22"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#00c8e0" stroke-width="2" opacity="0.3"/>

  <!-- Speed lines (motion blur effect, left side) -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="60" y1="155" x2="105" y2="160" stroke="#00c8e0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="168" x2="100" y2="168" stroke="#00c8e0" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="60" y1="181" x2="105" y2="176" stroke="#00c8e0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="72" y1="145" x2="108" y2="152" stroke="#4af0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="72" y1="191" x2="108" y2="184" stroke="#4af0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Speed lines (right side) -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="295" y1="160" x2="340" y2="155" stroke="#00c8e0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="300" y1="168" x2="352" y2="168" stroke="#00c8e0" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="295" y1="176" x2="340" y2="181" stroke="#00c8e0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="292" y1="152" x2="328" y2="145" stroke="#4af0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="292" y1="184" x2="328" y2="191" stroke="#4af0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Disc body (top ellipse / dome) -->
  <g filter="url(#discGlow)">
    <!-- Main disc shape: wide flat ellipse -->
    <ellipse cx="200" cy="168" rx="88" ry="22" fill="url(#discGrad)"/>

    <!-- Dome on top -->
    <ellipse cx="200" cy="158" rx="40" ry="16" fill="#4af0ff" opacity="0.9"/>

    <!-- Rim highlight -->
    <ellipse cx="200" cy="168" rx="88" ry="22" fill="none" stroke="#b0f8ff" stroke-width="1.5" opacity="0.6"/>

    <!-- Flight plate ring lines (spin indicator) -->
    <ellipse cx="200" cy="166" rx="65" ry="16" fill="none" stroke="#0077a8" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="200" cy="165" rx="44" ry="11" fill="none" stroke="#005f8a" stroke-width="1" opacity="0.5"/>

    <!-- Dome shine -->
    <ellipse cx="192" cy="153" rx="16" ry="7" fill="white" opacity="0.25"/>
  </g>

  <!-- Spin arc indicators (curved arrows around disc) -->
  <g filter="url(#glow)" opacity="0.85">
    <!-- Left spin arc -->
    <path d="M 130,148 A 75,30 0 0,0 130,188" fill="none" stroke="#4af0ff" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round"/>
    <!-- Right spin arc -->
    <path d="M 270,188 A 75,30 0 0,0 270,148" fill="none" stroke="#4af0ff" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round"/>
    <!-- Left arrowhead -->
    <polygon points="128,186 135,192 136,183" fill="#4af0ff"/>
    <!-- Right arrowhead -->
    <polygon points="272,150 265,144 264,153" fill="#4af0ff"/>
  </g>

  <!-- App name: HYZERTECH -->
  <text
    x="200" y="248"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="38"
    font-weight="900"
    letter-spacing="3"
    text-anchor="middle"
    fill="#ffffff"
    filter="url(#textGlow)"
  >HYZER<tspan fill="#00c8e0">TECH</tspan></text>

  <!-- Tagline -->
  <text
    x="200" y="272"
    font-family="'Arial', sans-serif"
    font-size="12"
    font-weight="400"
    letter-spacing="5"
    text-anchor="middle"
    fill="#4af0ff"
    opacity="0.75"
  >DISC ANALYTICS</text>

  <!-- Bottom measurement readout decoration -->
  <g opacity="0.5" font-family="'Courier New', monospace" font-size="11" fill="#00c8e0">
    <text x="116" y="310" text-anchor="middle">SPEED</text>
    <text x="116" y="324" text-anchor="middle" font-size="14" fill="#4af0ff" opacity="0.9">62 mph</text>
    <text x="284" y="310" text-anchor="middle">SPIN</text>
    <text x="284" y="324" text-anchor="middle" font-size="14" fill="#4af0ff" opacity="0.9">820 rpm</text>
    <!-- Divider -->
    <line x1="155" y1="305" x2="245" y2="305" stroke="#00c8e0" stroke-width="0.8" opacity="0.4"/>
    <line x1="155" y1="330" x2="245" y2="330" stroke="#00c8e0" stroke-width="0.8" opacity="0.4"/>
    <text x="200" y="320" text-anchor="middle" font-size="10" opacity="0.6">|</text>
  </g>
</svg>
